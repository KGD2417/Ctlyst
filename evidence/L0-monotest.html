<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Space+Mono:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{background:#FDFCF9;color:#1A1712;font:16px system-ui;padding:24px}
div{font-size:34px;margin:10px 0;letter-spacing:.06em}
.jb{font-family:'JetBrains Mono',monospace}.px{font-family:'IBM Plex Mono',monospace}
.sp{font-family:'Space Mono',monospace}.rb{font-family:'Roboto Mono',monospace}
span.l{font:13px system-ui;color:#857D6E;letter-spacing:.2em;text-transform:uppercase}</style>
<span class="l">JetBrains Mono</span><div class="jb">₹945 Cr · ₹10,000 Cr · ₹20 lakh · 000→100</div>
<span class="l">IBM Plex Mono</span><div class="px">₹945 Cr · ₹10,000 Cr · ₹20 lakh · 000→100</div>
<span class="l">Space Mono</span><div class="sp">₹945 Cr · ₹10,000 Cr · ₹20 lakh · 000→100</div>
<span class="l">Roboto Mono</span><div class="rb">₹945 Cr · ₹10,000 Cr · ₹20 lakh · 000→100</div>
<pre id="out" style="font:13px ui-monospace;color:#4A443A"></pre>
<script>
document.fonts.ready.then(()=>{
 const w=(t,f)=>{const c=document.createElement('canvas').getContext('2d');c.font='40px '+f;return c.measureText(t).width.toFixed(2)};
 const fams={'JetBrains Mono':1,'IBM Plex Mono':1,'Space Mono':1,'Roboto Mono':1};
 out.textContent=Object.keys(fams).map(f=>{
   const d=w('0',`"${f}"`), r=w('₹',`"${f}"`);
   return `${f.padEnd(16)} digit=${d} rupee=${r} ${d===r?'MONOSPACED-OK':'MISMATCH→glyph likely missing'}`;
 }).join('\n');
});
</script>
